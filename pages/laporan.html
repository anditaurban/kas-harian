<section class="grid gap-4 md:gap-6">
  <div class="flex flex-col justify-between gap-4 md:flex-row md:items-end">
    <div>
      <h2 class="text-2xl font-bold text-slate-950 md:text-3xl">Laporan</h2>
      <p class="mt-2 text-sm text-slate-500">Ringkasan periode, kategori, dan transaksi.</p>
    </div>
    <div class="flex flex-col gap-3 sm:flex-row">
      <button type="button" data-toast="Export PDF dummy berhasil diproses." class="rounded-2xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 active:scale-[0.98]">Export PDF</button>
      <button type="button" data-toast="Export Excel dummy berhasil diproses." class="rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.98]">Export Excel</button>
    </div>
  </div>

  <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label for="report-start-date" class="mb-2 block text-sm font-semibold text-slate-700">Tanggal awal</label>
        <input id="report-start-date" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <div>
        <label for="report-end-date" class="mb-2 block text-sm font-semibold text-slate-700">Tanggal akhir</label>
        <input id="report-end-date" type="date" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
    </div>
  </section>

  <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Total pemasukan</p>
      <p id="report-income" class="mt-3 text-2xl font-bold text-emerald-600">Rp0</p>
    </article>
    <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Total pengeluaran</p>
      <p id="report-expense" class="mt-3 text-2xl font-bold text-rose-600">Rp0</p>
    </article>
    <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Saldo akhir</p>
      <p id="report-balance" class="mt-3 text-2xl font-bold text-blue-600">Rp0</p>
    </article>
    <article class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
      <p class="text-sm font-medium text-slate-500">Jumlah transaksi</p>
      <p id="report-total" class="mt-3 text-2xl font-bold text-slate-950">0</p>
    </article>
  </div>

  <div class="grid gap-4 md:gap-6 xl:grid-cols-[0.42fr_0.58fr]">
    <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
      <h3 class="text-lg font-semibold text-slate-900">Ringkasan Kategori</h3>
      <div id="category-summary" class="mt-4 grid gap-3"></div>
    </section>
    <section>
      <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm">
        <table class="min-w-[860px] w-full">
          <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
            <tr>
              <th class="px-4 py-3 text-left">Tanggal</th>
              <th class="px-4 py-3 text-left">Kategori</th>
              <th class="px-4 py-3 text-left">Deskripsi</th>
              <th class="px-4 py-3 text-left">Jenis</th>
              <th class="px-4 py-3 text-left">Nominal</th>
              <th class="px-4 py-3 text-left">Status</th>
            </tr>
          </thead>
          <tbody id="report-table-body"></tbody>
        </table>
      </div>
    </section>
  </div>
</section>
