<section class="grid gap-4 md:gap-6">
  <div class="flex flex-col justify-between gap-4 md:flex-row md:items-end">
    <div>
      <h2 class="text-2xl font-bold text-slate-950 md:text-3xl">Transaksi Harian</h2>
      <p class="mt-2 text-sm text-slate-500">Cari, filter, dan pantau transaksi dari data dummy.</p>
    </div>
    <button type="button" data-page="tambah" class="rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.98]">Tambah Transaksi</button>
  </div>

  <section class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm">
    <div class="grid gap-4 md:grid-cols-3">
      <div>
        <label for="transaction-search" class="mb-2 block text-sm font-semibold text-slate-700">Cari transaksi</label>
        <input id="transaction-search" type="search" placeholder="Deskripsi, kategori, metode" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <div>
        <label for="transaction-type-filter" class="mb-2 block text-sm font-semibold text-slate-700">Jenis transaksi</label>
        <select id="transaction-type-filter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
          <option value="all">Semua jenis</option>
          <option value="income">Pemasukan</option>
          <option value="expense">Pengeluaran</option>
        </select>
      </div>
      <div>
        <label for="transaction-status-filter" class="mb-2 block text-sm font-semibold text-slate-700">Status</label>
        <select id="transaction-status-filter" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
          <option value="all">Semua status</option>
          <option value="Selesai">Selesai</option>
          <option value="Pending">Pending</option>
          <option value="Dibatalkan">Dibatalkan</option>
        </select>
      </div>
    </div>
  </section>

  <div class="overflow-x-auto rounded-3xl border border-slate-200 bg-white shadow-sm">
    <table class="min-w-[980px] w-full">
      <thead class="bg-slate-50 text-xs uppercase tracking-wide text-slate-500">
        <tr>
          <th class="px-4 py-3 text-left">Tanggal</th>
          <th class="px-4 py-3 text-left">Kategori</th>
          <th class="px-4 py-3 text-left">Deskripsi</th>
          <th class="px-4 py-3 text-left">Jenis</th>
          <th class="px-4 py-3 text-left">Nominal</th>
          <th class="px-4 py-3 text-left">Status</th>
          <th class="px-4 py-3 text-left">Aksi</th>
        </tr>
      </thead>
      <tbody id="transaction-table-body"></tbody>
    </table>
  </div>
</section>
