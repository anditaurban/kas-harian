<section class="grid gap-4 md:gap-6">
  <div>
    <h2 class="text-2xl font-bold text-slate-950 md:text-3xl">Tambah Transaksi</h2>
    <p class="mt-2 text-sm text-slate-500">Form front-end dummy untuk mencatat arus kas harian.</p>
  </div>

  <form id="transaction-form" class="rounded-3xl border border-slate-200 bg-white p-5 shadow-sm md:p-6">
    <div class="grid gap-4 md:grid-cols-2">
      <div>
        <label for="transaction-date" class="mb-2 block text-sm font-semibold text-slate-700">Tanggal</label>
        <input id="transaction-date" type="date" value="2026-06-04" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <div>
        <label for="transaction-type" class="mb-2 block text-sm font-semibold text-slate-700">Jenis transaksi</label>
        <select id="transaction-type" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
          <option value="income">Pemasukan</option>
          <option value="expense">Pengeluaran</option>
        </select>
      </div>
      <div>
        <label for="transaction-category" class="mb-2 block text-sm font-semibold text-slate-700">Kategori</label>
        <select id="transaction-category" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></select>
      </div>
      <div>
        <label for="transaction-amount" class="mb-2 block text-sm font-semibold text-slate-700">Nominal</label>
        <input id="transaction-amount" type="number" min="0" placeholder="Contoh: 250000" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <div>
        <label for="payment-method" class="mb-2 block text-sm font-semibold text-slate-700">Metode pembayaran</label>
        <select id="payment-method" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></select>
      </div>
      <div>
        <label for="transaction-description" class="mb-2 block text-sm font-semibold text-slate-700">Deskripsi</label>
        <input id="transaction-description" type="text" placeholder="Deskripsi transaksi" required class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100">
      </div>
      <div class="md:col-span-2">
        <label for="transaction-note" class="mb-2 block text-sm font-semibold text-slate-700">Catatan</label>
        <textarea id="transaction-note" rows="4" placeholder="Catatan tambahan" class="w-full rounded-2xl border border-slate-200 bg-white px-4 py-3 text-sm outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-4 focus:ring-blue-100"></textarea>
      </div>
    </div>
    <div class="mt-6 flex flex-col gap-3 sm:flex-row sm:justify-end">
      <button type="reset" class="rounded-2xl border border-slate-200 bg-white px-4 py-2.5 text-sm font-semibold text-slate-700 transition hover:bg-slate-50 active:scale-[0.98]">Reset</button>
      <button type="submit" class="rounded-2xl bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white shadow-sm transition hover:bg-blue-700 active:scale-[0.98]">Simpan</button>
    </div>
  </form>
</section>
